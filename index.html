><div style=\"font-size:14px;font-weight:600;color:#2F5FA8\">3+ years of experience<\u002Fdiv><p style=\"margin:8px 0 0 0;font-size:15px;line-height:1.65;color:#2D3748;text-align:left\">Chartered Accountant and B.Com graduate with a strong grounding in business management, bringing a practical, business-minded approach to finance and compliance work.<\u002Fp><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<section id=\"knowledge\" style=\"background:#fff;padding:80px 0\"><div style=\"max-width:1120px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:36px\"><div style=\"display:flex;flex-direction:column;gap:14px\"><span style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:14px;letter-spacing:3px;color:#1F7A43\">KNOWLEDGE BANK<\u002Fspan><h2 style=\"margin:0;font-family:Poppins,sans-serif;font-weight:700;font-size:clamp(28px,4vw,40px);line-height:1.15;letter-spacing:-0.5px;color:#0B2A5B;text-wrap:balance\">Laws, circulars and notifications, one click away.<\u002Fh2><p style=\"margin:0;font-size:17px;line-height:1.7;color:#2D3748;max-width:680px\">Direct and indirect tax, company law, labour and social-security laws, and state departments: quick links to the official sources we rely on.<\u002Fp><\u002Fdiv><div style=\"display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end\"><div style=\"flex:1 1 320px;display:flex;flex-direction:column;gap:6px\"><label for=\"kb-q\" style=\"font-size:14px;font-weight:600;color:#0B2A5B\">Search the knowledge bank<\u002Flabel><input id=\"kb-q\" type=\"search\" value=\"{{q}}\" sc-camel-on-input=\"{{onQ}}\" placeholder=\"e.g. GST, provident fund, Companies Act\" style=\"width:100%;box-sizing:border-box;padding:14px 16px;font-family:Inter,sans-serif;font-size:16px;border:1px solid #9CC4F0;border-radius:4px;background:#fff;color:#14213D\"><\u002Fdiv><\u002Fdiv><div style=\"display:flex;flex-wrap:wrap;gap:8px\"><sc-for list=\"{{cats}}\" as=\"c\" hint-placeholder-count=\"7\"><button type=\"button\" sc-ca tact\" style=\"background:#0B2A5B;padding:80px 0\"><div style=\"max-width:1120px;margin:0 auto;padding:0 24px;display:flex;flex-direction:column;gap:36px\"><div style=\"display:flex;flex-wrap:wrap;gap:40px 64px;align-items:flex-start\"><div style=\"flex:1 1 380px;display:flex;flex-direction:column;gap:20px\"><div style=\"display:flex;flex-direction:column;gap:14px\"><span style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:14px;letter-spacing:3px;color:#7FD6A0\">CONTACT<\u002Fspan><h2 style=\"margin:0;font-family:Poppins,sans-serif;font-weight:700;font-size:clamp(28px,4vw,40px);line-height:1.15;letter-spacing:-0.5px;color:#fff;text-wrap:balance\">Let’s talk about what your business needs next.<\u002Fh2><p style=\"margin:0;font-size:17px;line-height:1.7;color:#E6F1FA;max-width:680px\">Call or write to either partner, and tell us what you need. We will tailor our services to you.<\u002Fp><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:14px;background:#12356F;padding:24px;border-radius:4px\"><div style=\"display:flex;flex-direction:column;gap:6px\"><label for=\"f-name\" style=\"font-size:14px;font-weight:600;color:#E6F1FA\">Your name<\u002Flabel><input id=\"f-name\" type=\"text\" value=\"{{name}}\" sc-camel-on-input=\"{{onName}}\" style=\"width:100%;box-sizing:border-box;padding:14px 16px;font-family:Inter,sans-serif;font-size:16px;border:1px solid #9CC4F0;border-radius:4px;background:#fff;color:#14213D\"><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:6px\"><label for=\"f-phone\" style=\"font-size:14px;font-weight:600;color:#E6F1FA\">Phone<\u002Flabel><input id=\"f-phone\" type=\"tel\" value=\"{{phone}}\" sc-camel-on-input=\"{{onPhone}}\" style=\"width:100%;box-sizing:border-box;padding:14px 16px;font-family:Inter,sans-serif;font-size:16px;border:1px solid #9CC4F0;border-radius:4px;background:#fff;color:#14213D\"><\u002Fdiv><div style=\"display:flex;flex-direction:column;gap:8px\"><span style=\"font-size:14px;font-weight:600; ng:2px;color:#9CC4F0;margin-bottom:8px\">EMAIL<\u002Fdiv><a href=\"mailto:tiwarimalani@gmail.com\" style=\"color:#fff;text-decoration:underline;text-underline-offset:3px\">tiwarimalani@gmail.com<\u002Fa><\u002Fdiv><div><div style=\"font-family:Poppins,sans-serif;font-weight:600;font-size:13px;letter-spacing:2px;color:#9CC4F0;margin-bottom:8px\">VISIT US<\u002Fdiv>Tiwari Malani &amp; Co., Chartered Accountants<br>#114, 1st Floor, Mittal Chambers,<br>Ranigunj, Hyderabad, Telangana 500003<br><a href=\"https://www.google.com/maps/search/?api=1&amp;query=Mittal+Chambers+Ranigunj+Hyderabad+500003\" style=\"color:#fff;text-decoration:underline;text-underline-offset:3px\">Open in Google Maps<\u002Fa><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fsection>\n<footer style=\"background:#071C3F;color:#C9D8EC;padding:24px 0;font-size:14px\"><div style=\"max-width:1120px;margin:0 auto;padding:0 24px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 24px\"><span>© 2026 Tiwari Malani &amp; Co., Chartered Accountants<\u002Fspan><span>Hyderabad, Telangana<\u002Fspan><\u002Fdiv><\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:4900}}\">\nclass Component extends DCLogic {\nconstructor(p) { super(p); this.state = { tab: 0, name: '', phone: '', msg: '', interest: '', cat: 'All', q: '' }; }\nrenderVals() {\nconst G = [\n{ num:'01', label:'Accounting, GST & Income Tax', items:['Tailored accounting packages','ITR filing through to tax notices and scrutiny assessments','GST registration, return filing and guided compliance','TDS and TCS filings','Other tax compliances'] },\n{ num:'02', label:'Audit, Assurance & Advisory', items:['Reasonable assurance that accounts follow applicable GAAP','Statutory and internal audits, including petrol pumps, manufacturing units and similar businesses','Financial statement review and test checks of internal control','Business restructuring, planning and transaction advisory','Management consulting'] },\n{ num:'03', label:'Licenses & Registrations', items:['Employee State Insurance and Provident Fund','Labour Welfare and Professional Tax','Trade licences, FSSAI, Trade Marks and Copyrights','Registrations under any other act or regulation'] },\n{ num:'04', label:'Corporate & Legal', items:['Company incorporation','Secretarial compliances and filings','Drafting of partnership deeds, sale deeds, MOA and AOA','Tax litigation'] }\n];\nconst st = this.state, enc = encodeURIComponent;\nconst tabs = G.map((g, i) => ({ label: g.label, bg: i === st.tab ? '#2F5FA8' : '#FFFFFF', fg: i === st.tab ? '#FFFFFF' : '#0B2A5B', pick: () => this.setState({ tab: i }) }));\nconst g = G[st.tab];\nconst interests = G.map(x => x.label).concat(['Something else']).map(l => ({ label: l, bg: st.interest === l ? '#FFFFFF' : 'transparent', fg: st.interest === l ? '#0B2A5B' : '#FFFFFF', pick: () => this.setState({ interest: st.interest === l ? '' : l }) }));\nconst R = [\n{ cat:'Direct tax', name:'Income Tax Department', desc:'Income-tax Act 2025, Income-tax Act 1961, rules, circulars and notifications issued by the CBDT.', links:[{label:'Website',url:'https://incometaxindia.gov.in/'},{label:'Circulars',url:'https://incometaxindia.gov.in/Pages/communications/circulars.aspx'},{label:'Notifications',url:'https://incometaxindia.gov.in/Pages/communications/notifications.aspx'}] },\n{ cat:'Indirect tax', name:'CBIC: GST, Customs and Central Excise', desc:'GST circulars, notifications and orders issued by the Central Board of Indirect Taxes and Customs.', links:[{label:'CBIC GST site',url:'https://cbic-gst.gov.in/'},{label:'Tax information portal',url:'https://taxinformation.cbic.gov.in/'}] },\n{ cat:'Indirect tax', name:'GST Council', desc:'Council decisions and GST-related circulars and notifications.', links:[{label:'Website',url:'https://gstcouncil.gov.in/'}] },\n{ cat:'Companies', name:'Ministry of Corporate Affairs', desc:'Companies Act, rules, forms, notifications and general circulars for companies and LLPs.', links:[{label:'Website',url:'https://www.mca.gov.in/'}] },\n{ cat:'Labour & social security', name:'Ministry of Labour and Employment', desc:'The four Labour Codes took effect from 21 November 2025. Check here for the rules and notifications under them.', links:[{label:'Website',url:'https://labour.gov.in/'}] },\n{ cat:'Labour & social security', name:'Employees’ Provident Fund Organisation', desc:'Provident fund, pension and insurance schemes, with EPFO circulars.', links:[{label:'Website',url:'https://www.epfindia.gov.in/'},{label:'Circulars',url:'https://www.epfindia.gov.in/site_en/circulars.php'}] },\n{ cat:'Labour & social security', name:'Employees’ State Insurance Corporation', desc:'ESI scheme information, with instructions, circulars and orders.', links:[{label:'Website',url:'https://esic.gov.in/'},{label:'Circulars',url:'https://esic.gov.in/circulars'}] },\n{ cat:'Telangana', name:'Commercial Taxes Department, Telangana', desc:'State portal for dealer registration, GST services and professional tax in Telangana.', links:[{label:'Website',url:'https://www.tgct.gov.in/'}] },\n{ cat:'Acts & gazette', name:'India Code', desc:'Central and state Acts in one government repository.', links:[{label:'Website',url:'https://www.indiacode.nic.in/'}] },\n{ cat:'Acts & gazette', name:'The Gazette of India', desc:'Official gazette notifications published by the Government of India.', links:[{label:'Website',url:'https://egazette.gov.in/'}] }\n];\nconst CATS = ['All','Direct tax','Indirect tax','Companies','Labour & social security','Telangana','Acts & gazette'];\nconst ql = st.q.trim().toLowerCase();\nconst kbItems = R.filter(r => (st.cat === 'All' || r.cat === st.cat) && (!ql || (r.name + ' ' + r.desc + ' ' + r.cat).toLowerCase().indexOf(ql) >= 0));\nconst cats = CATS.map(c => ({ label: c, bg: st.cat === c ? '#2F5FA8' : '#FFFFFF', fg: st.cat === c ? '#FFFFFF' : '#0B2A5B', pick: () => this.setState({ cat: c }) }));\nconst body = 'Name: ' + st.name + '\\nPhone: ' + st.phone + '\\nNeed help with: ' + (st.interest || '-') + '\\n\\n' + st.msg;\nreturn {\ntabs, panel: { num: g.num, title: g.label, items: g.items.map(t => ({ t })) },\nask: () => this.setState({ interest: g.label }),\ncats, kbItems, kbEmpty: kbItems.length === 0, q: st.q, onQ: e => this.setState({ q: e.target.value }),\ninterests, name: st.name, phone: st.phone, msg: st.msg,\nonName: e => this.setState({ name: e.target.value }),\nonPhone: e => this.setState({ phone: e.target.value }),\nonMsg: e => this.setState({ msg: e.target.value }),\nmailHref: 'mailto:tiwarimalani@gmail.com?subject=' + enc('Enquiry' + (st.interest ? ': ' + st.interest : '')) + '&body=' + enc(body)\n};\n}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
